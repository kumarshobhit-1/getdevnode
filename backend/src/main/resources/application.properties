spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5433/getdevnode}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Google Gemini Configuration (Supports single key or comma-separated GEMINI_API_KEYS pool)
spring.ai.google.genai.api-keys=${GEMINI_API_KEYS:${GEMINI_API_KEY:${GENAI_API_KEY:dummy_key_for_build}}}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:${GENAI_API_KEY:dummy_key_for_build}}
spring.ai.google.genai.apiKey=${GEMINI_API_KEY:${GENAI_API_KEY:dummy_key_for_build}}
spring.ai.google.genai.chat.api-key=${GEMINI_API_KEY:${GENAI_API_KEY:dummy_key_for_build}}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:${GENAI_API_KEY:dummy_key_for_build}}
spring.ai.google.genai.chat.options.model=${GEMINI_CHAT_MODEL:gemini-3.6-flash}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001

# Groq Cloud Configuration (Supports single or comma-separated GROQ_API_KEYS pool)
app.groq.api-keys=${GROQ_API_KEYS:${GROQ_API_KEY:}}
app.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

# Pgvector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE


#Github Oauth2
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:dummy_github_client_id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:dummy_github_client_secret}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.github.user-name-attribute=id


server.servlet.session.cookie.name=GETDEVNODE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:none}
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.timeout=7d

#App Settings
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:getdevnode-token-encrypt-key-placeholder}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:8d9e0f1a2b3c4d5e}
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
app.github.api-delay-ms=50
