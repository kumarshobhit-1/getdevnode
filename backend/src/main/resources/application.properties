spring.application.name=backend

# Defaults match docker-compose.yml(postgres on host port 5433)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/getdevnode}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.ai.openai.api-key=${OPENAI_API_KEY:disabled}
spring.ai.openai.chat-model=gpt-4o-mini
spring.ai.openai.embed-model=text-embedding-3-small

spring.ai.google.genai.api-key=${GENAI_API_KEY:${GEMINI_API_KEY:disabled}}
spring.ai.google.genai.chat-model=gemini-1.5-turbo
spring.ai.google.genai.embed-model=gemini-1.5